[package]
name = "flux-lang"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
description = "Reference prototype for the Flux programming language"
publish = false

[features]
legacy-oracle = []

[lib]
name = "flux_lang"

[[bin]]
name = "flux"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-rational = "0.4.2"
num-traits = "0.2.19"
