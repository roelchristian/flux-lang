name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.85 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.85.0 fmt --all -- --check
      - name: Tests
        run: cargo +1.85.0 test --locked --all-targets
      - name: Legacy oracle public API
        if: matrix.os == 'ubuntu-latest'
        run: cargo +1.85.0 test --locked --features legacy-oracle --test compiler legacy_oracle_remains_available
      - name: Clippy
        run: cargo +1.85.0 clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo +1.85.0 build --locked --release
      - name: Numerical execution equivalence smoke
        if: matrix.os == 'ubuntu-latest'
        run: python3 benchmarks/numerical_equivalence.py target/release/flux target/release/flux --cases 2
